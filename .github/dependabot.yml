version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker/agent-base
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        versions: [">= 3.13"]
  - package-ecosystem: docker
    directory: /docker/opencode-agent
    schedule:
      interval: monthly
